spring.application.name=coworkhub

# ===== Base de datos MySQL =====
# Valores por defecto para desarrollo; se pueden sobrescribir con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coworkhub}
spring.datasource.username=${DB_USERNAME:coworkhub}
spring.datasource.password=${DB_PASSWORD:coworkhub}

# ===== JPA / Hibernate =====
# create: en cada arranque borra y crea las tablas y ejecuta src/main/resources/import.sql
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8

# ===== Seguridad (JWT) =====
# La clave debe tener al menos 32 caracteres (se valida al arrancar con @PostConstruct).
app.jwt.secret=${JWT_SECRET:coworkhub-clave-secreta-de-desarrollo-cambiar-en-produccion-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
# Orígenes permitidos para el frontend (CORS), separados por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173,null}

# ===== Actuator =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===== Swagger / OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
